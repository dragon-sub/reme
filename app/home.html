<!DOCTYPE html>
<html lang="ja" class="">
  <head>
    <!-- CSS / JS / Web Fonts -->
    <link href="style.css" rel="stylesheet">
    <link href="../favicon.ico" rel="icon">
    <script src="main.js" defer></script>
    <script src="home.js" defer></script>
    <script>
      (() => {
        const page = document.documentElement;
        const savedTheme = localStorage.getItem('remeTheme') || "beige";
        const savedMode = localStorage.getItem('remeMode');
        page.classList.add('noTransition');
        page.classList.add(savedTheme);
        if (savedMode === 'true') page.classList.add('dark');
        page.classList.remove('noTransition');
      })();
    </script>
    <!-- Metadata -->
    <title>Remé | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <header>
      <a href="home.html">
        <!-- Copyright (c) 2026 Jüw. All rights reserved. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 124 124" fill="none" class="logo">
          <rect width="124" height="124" rx="24" fill="var(--main-color-2)"/>
          <rect width="80" height="60" rx="10" x="30" y="35" fill="var(--main-color-3)"/>
          <rect width="80" height="60" rx="10" x="25" y="30" fill="var(--main-color-1)"/>
          <rect width="80" height="60" rx="10" x="20" y="25" fill="var(--header-color)"/>
          <rect width="60" height="10" rx="5" x="30" y="40" fill="var(--main-color-2)"/>
          <rect width="60" height="10" rx="5" x="30" y="55" fill="var(--main-color-2)"/>
        </svg>
      </a>
      <div class="select" id="language-select" tabindex="0" style="--size: 100px;">
        <div class="select-display">
          <span class="select-span">English</span>
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="M480-360 280-560h400z"/>
          </svg>
        </div>
        <div class="select-options">
          <div class="option" id="lang0">English</div>
          <div class="option" id="lang1">日本語</div>
          <div class="option" id="lang2">中文</div>
          <div class="option" id="lang3">Français</div>
          <div class="option" id="lang4">Español</div>
        </div>
      </div>
      <div class="buttons-wrapper">
        <input type="file" id="realInput" class="none"/>
        <button id="create-new-flashcards" class="header-button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--main-color-1)">
            <path d="M440-120v-320H120v-80h320v-320h80v320h320v80H520v320h-80Z"/>
          </svg>
          <span data-i18n="new">New</span>
        </button>
        <button id="search-flashcards" class="header-button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580t75.5-184.5T380-840t184.5 75.5T640-580q0 44-14 83t-38 69l252 252zM380-400q75 0 127.5-52.5T560-580t-52.5-127.5T380-760t-127.5 52.5T200-580t52.5 127.5T380-400"/>
          </svg>
          <span data-i18n="search">Search</span>
        </button>
        <button id="export-flashcards" class="header-button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326zM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160z"/>
          </svg>
          <span data-i18n="export">Export</span>
        </button>
        <button id="import-flashcards" class="header-button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="M440-160v-326L336-382l-56-58 200-200 200 200-56 58-104-104v326zM160-600v-120q0-33 23.5-56.5T240-800h480q33 0 56.5 23.5T800-720v120h-80v-120H240v120z"/>
          </svg>
          <span data-i18n="import">Import</span>
        </button>
        <button id="change-theme" class="header-button">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="M480-80q-82 0-155-31.5t-127.5-86-86-127.5T80-480q0-83 32.5-156t88-127T330-848.5 488-880q80 0 151 27.5t124.5 76 85 115T880-518q0 115-70 176.5T640-280h-74q-9 0-12.5 5t-3.5 11q0 12 15 34.5t15 51.5q0 50-27.5 74T480-80M303-457q17-17 17-43t-17-43-43-17-43 17-17 43 17 43 43 17 43-17m120-160q17-17 17-43t-17-43-43-17-43 17-17 43 17 43 43 17 43-17m200 0q17-17 17-43t-17-43-43-17-43 17-17 43 17 43 43 17 43-17m120 160q17-17 17-43t-17-43-43-17-43 17-17 43 17 43 43 17 43-17M480-160q9 0 14.5-5t5.5-13q0-14-15-33t-15-57q0-42 29-67t71-25h70q66 0 113-38.5T800-518q0-121-92.5-201.5T488-800q-136 0-232 93t-96 227q0 133 93.5 226.5T480-160"/>
          </svg>
          <span data-i18n="theme">Theme</span>
        </button>
      </div>
    </header>
    <main>
      <div class="page-title" data-i18n="flashcards">Flashcards</div>
      <div class="flashcard-list">
        <template id="flashcard-item">
          <a class="move-to-play">
            <div class="flashcard-item" style="">
              <div class="flashcard-title"></div>
              <div>
                <span class="flashcard-progress"></span>
                <svg class="cards-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
                  <path d="M130-189 81-546q-5-32 15.5-58t52.5-31l61 435 283-40h267q-8 21-24.5 35.5T695-187l-477 66q-33 5-58-15t-30-53m190-127q-33 0-56.5-23.5T240-396v-364q0-33 23.5-56.5T320-840h480q33 0 56.5 23.5T880-760v364q0 33-23.5 56.5T800-316zm0-80h480v-364H320zm0 0v-364zm80-204h320v-80H400zm0 120h200v-80H400z"/>
                </svg>
                <span class="flashcard-number-of-cards"></span>
              </div>
              <div class="flashcard-bar-wrapper">
                <div class="flashcard-bar-inner"></div>
              </div>
            </div>
          </a>
        </template>
      </div>
    </main>
    <footer>
      &copy; 2026 <a href="https://drsb.f5.si">Jüw.</a> All Rights Reserved.
    </footer>
    <div class="shadow" id="drawer-shadow"></div>
    <div class="drawer" id="drawer-theme">
      <div class="drawer-contents">
        <a href="javascript:void(0)">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
            <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224z"/>
          </svg>
        </a>
        <div class="drawer-title" id="theme-title"></div>
        <small data-i18n="theme">Theme</small>
        <div class="select" tabindex="0" style="--size: calc(100% - 20px);margin: 20px 0 10px 0;" id="theme-select">
          <div class="select-display">
            <span class="select-span" id="light-or-dark">Light</span>
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="var(--main-color-1)">
              <path d="M480-360 280-560h400z"/>
            </svg>
          </div>
          <div class="select-options">
            <div class="option" id="toggleLight" data-i18n="light">Light</div>
            <div class="option" id="toggleDark" data-i18n="dark">Dark</div>
          </div>
        </div>
        <div class="theme-container"></div>
      </div>
    </div>
  </body>
</html>
